spring.application.name=organizador-estudos

# A porta pode ser trocada com a variável PORT (o padrão é 8080)
server.port=${PORT:8080}

# Banco H2 em memória: começa sempre vazio e zera quando a aplicação reinicia.
# Para usar PostgreSQL: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:h2:mem:estudos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# O console do H2 fica desligado: o banco não tem senha e a aplicação pode ficar na internet
spring.h2.console.enabled=false

# O back-end também serve a pasta do front-end, assim tudo abre em um endereço só.
# O caminho é relativo à pasta de onde o back-end é iniciado (backend/).
app.frontend-dir=../frontend/
spring.web.resources.static-locations=classpath:/static/,file:${app.frontend-dir}

# Se o front-end ficar em outro endereço (ex.: Vercel), liste aqui as origens permitidas, separadas por vírgula
app.cors.origens=

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
